<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Animes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Minha Lista de Animes</h1>

    <div class="container">

        <div class="cadastro">
            <h2>Adicionar Anime</h2>

            <p>Nome do anime:</p>
            <input type="text" id="nome">

            <p>Genero:</p>
            <input type="text" id="genero">

            <p>Episodios:</p>
            <input type="number" id="episodios">

            <p>Nota:</p>
            <input type="number" id="nota">

            <p>Status:</p>
            <select id="status">
                <option>Assistindo</option>
                <option>Completo</option>
                <option>Quero assistir</option>
                <option>Abandonado</option>
            </select>

            <br><br>
            <button onclick="adicionar()">Adicionar</button>
        </div>

        <div class="lista">
            <h2>Meus Animes</h2>

            <input type="text" id="pesquisa" placeholder="Pesquisar anime..." onkeyup="mostrarLista()">

            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Genero</th>
                        <th>Eps</th>
                        <th>Nota</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela">
                </tbody>
            </table>

            <p id="total">Total: 0</p>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
